<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gather Clone</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        min-height: 100vh;
        box-sizing: border-box;
        padding: 8px;
        background: #1a1a1a;
        color: #ddd;
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      /* O palco (mapa + chat) ocupa toda a altura disponível; os controles/vídeo
         ficam abaixo com sua altura natural. */
      .stage {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        align-items: stretch;
        gap: 12px;
        width: 100%;
      }
      /* Canvas responsivo: preenche o palco (o buffer é ajustado por JS). */
      #game {
        flex: 1 1 auto;
        min-width: 0;
        width: 100%;
        height: 100%;
        border: 2px solid #444;
        background: #000;
        image-rendering: pixelated;
      }
      canvas {
        image-rendering: pixelated;
      }
      .hint {
        font-size: 13px;
        opacity: 0.7;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .mic-button {
        font: inherit;
        font-size: 14px;
        padding: 6px 12px;
        border-radius: 6px;
        border: 2px solid #444;
        background: #2e7d32; /* verde = transmitindo */
        color: #fff;
        cursor: pointer;
      }
      .mic-button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .mic-button.muted {
        background: #c62828; /* vermelho = mudo */
      }
      .mic-button.talking {
        background: #1565c0; /* azul = push-to-talk ativo */
      }
      .mic-button.cam {
        background: #455a64; /* cinza = câmera desligada */
      }
      .mic-button.char {
        background: #5e35b1; /* roxo = personagem */
      }
      /* --- Seleção de personagem (Etapa 8) --- */
      .char-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        z-index: 10;
        align-items: center;
        justify-content: center;
      }
      .char-overlay.open {
        display: flex;
      }
      .char-dialog {
        background: #202028;
        border: 2px solid #444;
        border-radius: 8px;
        padding: 20px;
        text-align: center;
      }
      .char-dialog h2 {
        margin: 0 0 14px;
        font-size: 16px;
      }
      .char-grid {
        display: flex;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .char-option {
        background: #16161c;
        border: 2px solid #444;
        border-radius: 6px;
        padding: 8px;
        cursor: pointer;
        color: #ddd;
        font: inherit;
      }
      .char-option canvas {
        display: block;
        image-rendering: pixelated;
        width: 64px;
        height: 64px;
      }
      .char-option .char-label {
        font-size: 12px;
        margin-top: 4px;
      }
      .char-option.selected {
        border-color: #64b5f6;
        outline: 2px solid #64b5f6;
      }
      .mic-button.cam.on {
        background: #1565c0; /* azul = câmera ligada */
      }
      /* --- Barra de vídeo (Fase 2) --- */
      .video-bar {
        display: flex;
        gap: 8px;
        min-height: 0;
        flex-wrap: wrap;
        justify-content: center;
        max-width: 900px;
      }
      .video-tile {
        position: relative;
        width: 160px;
        height: 120px;
        background: #000;
        border: 2px solid #444;
        border-radius: 4px;
        overflow: hidden;
      }
      .video-tile video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .video-tile .label {
        position: absolute;
        left: 0;
        bottom: 0;
        padding: 2px 6px;
        font-size: 11px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
      }

      /* --- Chat (Etapa 6) --- */
      .chat {
        display: flex;
        flex-direction: column;
        flex: 0 0 240px;
        width: 240px;
        border: 2px solid #444;
        background: #202028;
      }
      .chat-log {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding: 8px;
        font-size: 13px;
        line-height: 1.45;
        word-break: break-word;
      }
      .chat-msg {
        margin-bottom: 4px;
      }
      .chat-author {
        color: #64b5f6;
        font-weight: 600;
      }
      .chat-msg--self .chat-author {
        color: #81c784;
      }
      .chat-msg--system {
        opacity: 0.6;
        font-style: italic;
      }
      .chat-input {
        border: 0;
        border-top: 2px solid #444;
        padding: 8px;
        background: #16161c;
        color: #ddd;
        font: inherit;
        font-size: 13px;
        outline: none;
      }
      .chat-input:disabled {
        opacity: 0.5;
      }
      .name-input {
        border-top: 0;
        border-bottom: 2px solid #444;
        color: #81c784;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <canvas id="game" width="640" height="480"></canvas>
      <aside class="chat">
        <input
          id="name-input"
          class="chat-input name-input"
          type="text"
          maxlength="24"
          placeholder="Seu nome"
        />
        <div id="chat-log" class="chat-log"></div>
        <input
          id="chat-input"
          class="chat-input"
          type="text"
          maxlength="500"
          placeholder="Conectando…"
          disabled
        />
      </aside>
    </div>
    <div id="video-bar" class="video-bar"></div>
    <div class="controls">
      <button id="mic-button" class="mic-button" type="button" disabled>🎙️ Microfone</button>
      <button id="camera-button" class="mic-button cam" type="button" disabled>📷 Câmera</button>
      <button id="character-button" class="mic-button char" type="button" disabled>🧑 Personagem</button>
      <span class="hint">M: mudo · Espaço (segurar): falar</span>
    </div>

    <div id="char-overlay" class="char-overlay">
      <div class="char-dialog">
        <h2>Escolha seu personagem</h2>
        <div id="char-grid" class="char-grid"></div>
        <button id="char-close" class="mic-button" type="button">Pronto</button>
      </div>
    </div>
    <div class="hint">Clique com o botão esquerdo em um piso para mover o avatar até lá.</div>
    <div class="hint" id="webrtc-status">WebRTC: —</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
