<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gather Clone — Editor de Mapas</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #1a1a1a;
        color: #ddd;
        font-family: system-ui, sans-serif;
      }
      .app {
        display: flex;
        gap: 16px;
        padding: 16px;
        align-items: flex-start;
      }
      .sidebar {
        width: 240px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        flex-shrink: 0;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        opacity: 0.7;
        margin: 0 0 6px;
      }
      .group {
        border: 1px solid #333;
        border-radius: 6px;
        padding: 10px;
        background: #202028;
      }
      button {
        font: inherit;
        font-size: 13px;
        padding: 6px 10px;
        border-radius: 5px;
        border: 1px solid #444;
        background: #2c2c36;
        color: #ddd;
        cursor: pointer;
      }
      button:hover {
        background: #363642;
      }
      .tools {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .tools button.active {
        outline: 2px solid #64b5f6;
        background: #37474f;
      }
      .palette {
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-height: 46vh;
        overflow-y: auto;
        padding-right: 4px;
      }
      .pal-cat {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        opacity: 0.6;
        margin: 6px 0 2px;
      }
      .pal-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
      }
      .pal-item {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 3px 5px;
        font-size: 11px;
        text-align: left;
        line-height: 1.1;
      }
      .pal-item canvas {
        width: 30px;
        height: 30px;
        flex-shrink: 0;
        background: #14141a;
        border-radius: 3px;
        image-rendering: pixelated;
      }
      .pal-item.sel {
        outline: 2px solid #ffb74d;
        background: #3a3320;
      }
      .swatch {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 2px;
        margin-right: 6px;
        vertical-align: middle;
        border: 1px solid #0006;
      }
      .row {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-bottom: 6px;
      }
      .row label {
        font-size: 12px;
        width: 54px;
      }
      .row input {
        width: 60px;
        font: inherit;
        padding: 3px 5px;
        background: #16161c;
        color: #ddd;
        border: 1px solid #444;
        border-radius: 4px;
      }
      .rooms-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
        max-height: 140px;
        overflow-y: auto;
      }
      .rooms-list .room {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #2c2c36;
        padding: 3px 6px;
        border-radius: 4px;
      }
      .rooms-list .room button {
        padding: 1px 6px;
        font-size: 12px;
      }
      .full {
        width: 100%;
      }
      .canvas-wrap {
        overflow: auto;
        max-width: calc(100vw - 300px);
        max-height: calc(100vh - 32px);
        border: 2px solid #444;
        background: #000;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        cursor: crosshair;
      }
      .status {
        font-size: 12px;
        min-height: 32px;
        line-height: 1.4;
      }
      .status.error {
        color: #ff8a80;
      }
      .status.ok {
        color: #a5d6a7;
      }
      .hint {
        font-size: 11px;
        opacity: 0.6;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="sidebar">
        <h1>Editor de Mapas</h1>

        <div class="group">
          <h2>Ferramenta</h2>
          <div class="tools" id="tools">
            <button data-tool="paint">🖌️ Pincel</button>
            <button data-tool="rect">▬ Retângulo</button>
            <button data-tool="erase">🧽 Apagar</button>
            <button data-tool="spawn">📍 Spawn</button>
            <button data-tool="room">▭ Sala</button>
            <button data-action="undo" title="Ctrl+Z">↶ Desfazer</button>
            <button data-action="redo" title="Ctrl+Y">↷ Refazer</button>
          </div>
          <p class="hint">Escolha um sprite na paleta e pinte (clique/arraste). Retângulo preenche uma área. Ctrl+Z / Ctrl+Y.</p>
        </div>

        <div class="group">
          <h2>Paleta</h2>
          <div class="tools" id="place-mode" style="margin-bottom:8px">
            <button data-place="furniture" title="Cola o sprite como móvel sólido no chão">🪑 Móvel</button>
            <button data-place="decal" title="Cola o sprite na face da parede (não altera colisão)">🖼️ Decal</button>
          </div>
          <p class="hint" style="margin:0 0 6px">Modo de colagem para itens não-terreno.</p>
          <div class="palette" id="palette"></div>
        </div>

        <div class="group">
          <h2>Salas</h2>
          <div class="rooms-list" id="rooms-list"></div>
        </div>

        <div class="group">
          <h2>Novo mapa</h2>
          <div class="row"><label>Largura</label><input id="new-w" type="number" min="1" max="200" value="30" /></div>
          <div class="row"><label>Altura</label><input id="new-h" type="number" min="1" max="200" value="20" /></div>
          <div class="row"><label>Tile (px)</label><input id="new-ts" type="number" min="8" max="128" value="32" /></div>
          <button class="full" id="btn-new">Criar mapa em branco</button>
        </div>

        <div class="group">
          <h2>Arquivo</h2>
          <button class="full" id="btn-import" style="margin-bottom:6px">Importar map.json…</button>
          <input id="file-input" type="file" accept="application/json,.json" style="display:none" />
          <button class="full" id="btn-export">Exportar map.json</button>
        </div>

        <div class="status" id="status"></div>
      </div>

      <div class="canvas-wrap">
        <canvas id="editor" width="960" height="640"></canvas>
      </div>
    </div>
    <script type="module" src="/src/editor.ts"></script>
  </body>
</html>
