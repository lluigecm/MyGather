# coturn — configuração de exemplo para o Gather Clone (Fase 2, item 3).
# TURN auto-hospedado, autenticação por segredo compartilhado (efêmera).
#
# Instale o coturn e rode:  turnserver -c infra/turnserver.conf
# (em produção, rode como serviço e atrás de firewall com as portas liberadas)

# Portas TURN/STUN.
listening-port=3478
tls-listening-port=5349

# IPs. Em uma VM/servidor com IP público, descomente e ajuste:
# listening-ip=0.0.0.0
# external-ip=SEU_IP_PUBLICO
# relay-ip=SEU_IP_PRIVADO

# Autenticação por segredo compartilhado (REST API / credenciais efêmeras).
# ESTE segredo tem de ser IGUAL ao TURN_SECRET do servidor Node.
use-auth-secret
static-auth-secret=TROQUE_ESTE_SEGREDO_compartilhado_com_o_servidor

# Realm (qualquer domínio que identifique seu deploy).
realm=mygather.local

# Boas práticas / robustez para um protótipo pequeno.
fingerprint
stale-nonce=600
total-quota=100
no-multicast-peers
# Não permite relay para faixas privadas/perigosas a partir de peers externos.
no-loopback-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255

# Para TURNS (TURN sobre TLS) — use o mesmo par de certificados do HTTPS:
# cert=/caminho/para/cert.pem
# pkey=/caminho/para/key.pem

# Log
verbose
